solon.dataSources:
  db:
    class: "com.zaxxer.hikari.HikariDataSource"
    driverClassName: com.p6spy.engine.spy.P6SpyDriver
    jdbcUrl: jdbc:p6spy:mysql://127.0.0.1:3306/数据库名?characterEncoding=UTF-8&allowMultiQueries=true&serverTimezone=UTC
    username: 用户
    password: 密码
    maximumPoolSize: 20
    minimumIdle: 5
    connectionTimeout: 30000
    validationTimeout: 5000
    idleTimeout: 600000
    maxLifetime: 1800000
admin:
  username: "admin"
  passwordHash: ""
  #code: "接口的code参数" //如果需要使用获取邀请码参数请修改这个参数，重启生效
user:
  allowuptxt: false  #是否允许上传txt 允许 true 不允许 false
  allowcache: false  #是否允许添加缓存 允许 true 不允许 false
  source: 0  #0为不允许修改书源，1为允许修改后台书源，2独立书源
